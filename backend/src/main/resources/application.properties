spring.application.name=helpdesk
server.port=${PORT:8080}

# Local: usa MySQL na máquina. Na nuvem, informe DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O script SQL cria as tabelas. 'update' facilita a primeira aula; em produção use migrações.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Separe vários endereços por vírgula. Configure com o domínio pages.dev na implantação.
#noinspection SpringBootApplicationProperties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
